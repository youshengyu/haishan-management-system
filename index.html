<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海山教室全方位管理系統</title>
  
  <!-- 引入 Font Awesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 引入 Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入 Tailwind CSS (關閉 preflight 避免與 Bootstrap 衝突) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Microsoft JhengHei", "Inter", sans-serif;
      background-color: #f1f5f9;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .app-sidebar {
      width: 220px;
      min-width: 220px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
      z-index: 9999;
      height: 100%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-x: hidden;
    }

    /* 側邊欄收合時的樣式 */
    .app-sidebar.collapsed {
      width: 72px;
      min-width: 72px;
    }

    .sidebar-header {
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      white-space: nowrap;
    }

    .brand-info {
      overflow: hidden;
      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.25s ease, transform 0.25s ease, max-width 0.3s ease;
      max-width: 150px;
    }

    .app-sidebar.collapsed .brand-info {
      opacity: 0;
      transform: translateX(-16px);
      max-width: 0;
      pointer-events: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #4f46e5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
      flex-shrink: 0;
    }

    .brand-title { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .brand-sub { font-size: 11px; color: #94a3b8; }

    .nav-menu {
      padding: 16px 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      padding: 0 10px 4px;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .app-sidebar.collapsed .nav-label {
      opacity: 0;
      transform: translateX(-12px);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      border-radius: 10px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
    }

    .nav-item span {
      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .app-sidebar.collapsed .nav-item span {
      opacity: 0;
      transform: translateX(-16px);
      pointer-events: none;
    }

    .nav-item i { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
    .nav-item:hover { background-color: rgba(255, 255, 255, 0.08); color: #ffffff; }
    .nav-item.active {
      background-color: #4f46e5;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    /* 縮合切換按鈕樣式 */
    .collapse-btn {
      position: absolute;
      right: 10px;
      top: 26px;
      width: 24px;
      height: 24px;
      background: #4f46e5;
      color: white;
      border: 2px solid #0f172a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      z-index: 10000;
      transition: transform 0.3s ease, right 0.3s ease, background-color 0.2s ease;
    }
    .app-sidebar.collapsed .collapse-btn {
      right: 24px;
      top: 64px;
    }
    .collapse-btn:hover {
      background: #6366f1;
      transform: scale(1.1);
    }
    .app-sidebar.collapsed .collapse-btn i {
      transform: rotate(180deg);
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      color: #64748b;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .app-sidebar.collapsed .sidebar-footer {
      opacity: 0;
      transform: translateX(-16px);
      pointer-events: none;
    }

    .app-main {
      flex-grow: 1;
      height: 100%;
      overflow-y: auto;
      position: relative;
      background-color: #f8f9fa;
    }

    .system-section {
      display: none;
      width: 100%;
      min-height: 100%;
    }
    .system-section.active {
      display: block;
    }

    #sec-textbooks .card { max-width: 100% !important; width: 100% !important; }
  </style>
</head>
<body>

  <div class="app-container">
    <aside id="appSidebar" class="app-sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="fa-solid fa-school"></i></div>
        <div class="brand-info">
          <div class="brand-title">海山教室</div>
          <div class="brand-sub">行政與教務管理系統</div>
        </div>
        <!-- 側邊欄縮合切換按鈕 -->
        <button class="collapse-btn" onclick="toggleSidebar()" title="收合/展開選單">
          <i class="fa-solid fa-chevron-left" id="collapseIcon"></i>
        </button>
      </div>

      <nav class="nav-menu">
        <div class="nav-label">系統功能選單</div>
        
        <button class="nav-item active" onclick="switchTab('records', this)" title="日常事蹟紀錄表">
          <i class="fa-solid fa-clipboard-list"></i>
          <span>日常事蹟紀錄表</span>
        </button>

        <button class="nav-item" onclick="switchTab('textbooks', this)" title="教科書版本查詢">
          <i class="fa-solid fa-book-open"></i>
          <span>教科書版本查詢</span>
        </button>

        <button class="nav-item" onclick="switchTab('exams', this)" title="歷屆段考資源網">
          <i class="fa-solid fa-file-pdf"></i>
          <span>歷屆段考資源網</span>
        </button>

        <button class="nav-item" onclick="switchTab('links', this)" title="各校官方網站">
          <i class="fa-solid fa-globe"></i>
          <span>各校官方網站</span>
        </button>

        <button class="nav-item" onclick="switchTab('templates', this)" title="常用聯絡事項範本">
          <i class="fa-solid fa-comments"></i>
          <span>常用聯絡事項範本</span>
        </button>

        <button class="nav-item" onclick="switchTab('schedule', this)" title="學校段考日與大考查詢">
          <i class="fa-solid fa-calendar-days"></i>
          <span>學校段考日與大考查詢</span>
        </button>
      </nav>

      <div class="sidebar-footer">補習班專屬系統 v2.0</div>
    </aside>

    <main class="app-main">
      <div id="sec-records" class="system-section active p-4">
        <?!= include('Page_Records'); ?>
      </div>

      <div id="sec-textbooks" class="system-section p-4">
        <?!= include('Page_Textbooks'); ?>
      </div>

      <div id="sec-exams" class="system-section">
        <?!= include('Page_Exams'); ?>
      </div>

      <div id="sec-links" class="system-section p-4">
        <?!= include('Page_Links'); ?>
      </div>

      <div id="sec-templates" class="system-section p-4">
        <?!= include('Page_Templates'); ?>
      </div>

      <div id="sec-schedule" class="system-section p-4">
        <?!= include('Page_Schedule'); ?>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function switchTab(sysKey, btn) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.system-section').forEach(sec => sec.classList.remove('active'));
      document.getElementById('sec-' + sysKey).classList.add('active');
      
      document.querySelector('.app-main').scrollTop = 0;
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('appSidebar');
      sidebar.classList.toggle('collapsed');
    }
  </script>
</body>
</html>
